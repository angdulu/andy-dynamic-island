<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vector Face Pet</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      .app-shell {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        display: block;
      }

      .stage-panel {
        width: 100vw;
        height: 100vh;
        min-height: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      #pet-canvas {
        width: 100vw;
        height: 100vh;
        min-height: 0;
      }

      .hud,
      .face-toggle,
      .status-readout,
      .control-panel {
        display: none;
      }
    </style>
  </head>
  <body class="face-window">
    <main class="app-shell">
      <section class="stage-panel" aria-label="Vector pet stage">
        <canvas id="pet-canvas" width="430" height="310"></canvas>
        <div class="hud" aria-live="polite">
          <span id="mood-label">Curious</span>
          <span id="animation-label">loading animation assets</span>
        </div>
        <div id="status-readout" class="status-readout" aria-hidden="true"></div>
        <button id="face-mode-button" class="face-toggle" type="button">Show body</button>
      </section>

      <aside class="control-panel" aria-label="Pet controls">
        <select id="animation-select"></select>
        <input id="energy-range" type="range" min="0" max="100" value="68">
        <button id="tap-button" type="button">Tap</button>
        <button id="nap-button" type="button">Nap</button>
        <button id="random-button" type="button">Random</button>
        <button id="idle-button" type="button">Idle</button>
        <button type="button" data-mood="curious">Curious</button>
        <button type="button" data-mood="happy">Happy</button>
        <button type="button" data-mood="sleepy">Sleepy</button>
      </aside>
    </main>

    <script src="engine.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
