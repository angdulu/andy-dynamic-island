<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Andy</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        background: transparent;
      }
      .app-shell {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        display: block;
      }
      .stage-panel {
        width: 100vw;
        height: 100vh;
        min-height: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      #pet-canvas {
        width: 100vw;
        height: 100vh;
        min-height: 0;
      }
      .hud, .face-toggle, .status-readout, .control-panel {
        display: none !important;
      }

    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-panel" aria-label="Vector pet stage">
        <canvas id="pet-canvas" width="960" height="620"></canvas>
        <div class="hud" aria-live="polite">
          <span id="mood-label">Curious</span>
          <span id="animation-label">loading animation assets</span>
        </div>
        <div id="status-readout" class="status-readout" aria-hidden="true"></div>
        <button id="face-mode-button" class="face-toggle" type="button">Show body</button>
      </section>

      <aside class="control-panel" aria-label="Pet controls">
        <div class="brand">
          <p class="eyebrow">MacBook pet</p>
          <h1>Vector</h1>
        </div>

        <div class="control-group">
          <label for="animation-select">Animation</label>
          <select id="animation-select"></select>
        </div>

        <div class="control-row">
          <button id="random-button" class="command" type="button">Random</button>
          <button id="idle-button" class="command" type="button">Idle</button>
        </div>

        <div class="control-group">
          <label>Mood</label>
          <div class="segmented" role="group" aria-label="Mood">
            <button class="is-active" type="button" data-mood="curious">Curious</button>
            <button type="button" data-mood="happy">Happy</button>
            <button type="button" data-mood="sleepy">Sleepy</button>
          </div>
        </div>

        <div class="control-group">
          <label for="energy-range">Energy</label>
          <input id="energy-range" type="range" min="0" max="100" value="68">
        </div>

        <div class="control-row">
          <button id="tap-button" class="command" type="button">Tap</button>
          <button id="nap-button" class="command" type="button">Nap</button>
        </div>
      </aside>
    </main>

    <script src="engine.js"></script>
    <script src="pet.js"></script>
    <script>
      console.log("Andy HTML loaded successfully!");
    </script>
  </body>
</html>
